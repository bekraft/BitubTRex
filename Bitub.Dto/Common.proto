syntax = "proto3";
package Bitub.Dto;

// Version 1.1
option csharp_namespace = "Bitub.Dto";
option java_package = "bitub.dto";

// Logical information, which might be unknown.
message Logical {
	oneof flag {
		bool known = 1;
	}
}

// Raw GUID
message Guid {
	bytes raw = 1;	
}

// Global Unique ID is either binary or base64 representation
message GlobalUniqueId {
	oneof guidOrString {
		 Guid guid = 1;
		 string base64 = 2;
	}
}

// Qualifier either by GUID or name
message Qualifier {
	oneof guidOrName {
		GlobalUniqueId anonymous = 1;
		Name named = 2;
	}
}

// Concept Uniform Resource Indentifier
message Name {
	repeated string frags = 2;
}

// A classifier as representative reference path
message Classifier {
	repeated Qualifier path = 1;
}

// A reference ID based on local or global identification
message RefId {
	oneof localOrGlobal {
		int32 nid = 1;
		Qualifier sid = 2;
	}
}

// The semantic data type
enum DataType {
	UNDEFINED = 0;
	LABEL = 1;
	GUID = 2;
	ID = 3;
	DECIMAL = 4;
	INTEGER = 5;
	TEXT = 6;
	ENUM = 7;
	BOOLEAN = 8;
	LOGICAL = 9;
	TIMESTAMP = 10;
}

// SI Unit
enum DataUnitSI {
	NONE = 0;
	METER = 1;
	KILOGRAM = 2;
	SECOND = 3;
}

// Unit's prefix
enum DataUnitPrefix {
	UNIT = 0;
	NANO = -9;
	MICRO = -6;
	MILLI = -3;
	DECI = 1;
	CENTI = 2;
	KILO = 3;
	MEGA = 6;
	GIGA = 9;
}

// The feature data operator
enum DataOp {
	Equals = 0;
	Less = 1;
	LessThanEquals = 2;
	Greater = 3;
	GreaterThanEquals = 4;
}
