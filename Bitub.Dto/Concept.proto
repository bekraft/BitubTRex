syntax = "proto3";
package Bitub.Dto.Concept;

import "Common.proto";
import "google/protobuf/timestamp.proto";

// Version 1.3.1

option csharp_namespace = "Bitub.Dto.Concept";
option java_package = "bitub.dto";

// A domain space
message ELDomain {
	Qualifier canonical = 1;
	repeated ELConcept concepts = 2;
}

// A general composite concept
message ELConcept {
	Qualifier canonical = 1; // canonical name
	repeated Feature feature = 2; // features of this concept
	repeated Qualifier subsumes = 3; // concept subsumption of hyponyms (conjunction if > 1)
}

// A list of feature bag
message FeatureBag {
	Qualifier name = 1;
	repeated Feature feature = 2;
}

// A feature is either a role or a data concept
message Feature {
	Qualifier name = 1;
	oneof feature {
		FeatureRole role = 2;
		FeatureData data = 3;
	}
}

// A role concept (i.e. a classification)
message FeatureRole {
	Qualifier qualifier = 1;
}

// A data concept (i.e. a single value of primitive type)
message FeatureData {
	DataType type = 1;
	DataUnitSI unit = 2;
	DataUnitPrefix unitPrefix = 3;
	DataOp op = 4;
	oneof dataValue {
		double digit = 5;
		string value = 6;
		google.protobuf.Timestamp timeStamp = 7;
		Logical logical = 8;
		GlobalUniqueId guid = 9;
	}
}
